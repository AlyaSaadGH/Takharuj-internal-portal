<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار الاتصال بالـ API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css?v=20260922">

<body class="api-test-page light">
  <div class="container card">
    <h1>🔗 اختبر الاتصال بين الفرونت والباكند</h1>
    
    <div id="connectionStatus" class="status info">⏳ جاري الفحص...</div>
    
    <div style="margin: 20px 0;">
      <h3>📋 الاختبارات المتاحة:</h3>
      
      <button class="btn" onclick="testApiConnection()">✅ اختبر الاتصال بالـ API</button>

      <button class="btn" onclick="createTestClient()">➕ أضف عميل اختبار</button>
      <button class="btn" onclick="fetchInvoicesFromAPI()">📄 جلب الفواتير</button>
      <button class="btn" onclick="viewSwagger()">📖 شاهد التوثيق (Swagger)</button>
    </div>

    <div id="results" aria-live="polite"></div>
  </div>

  <script src="js/api-client.js?v=20261014-demo1"></script>
  <script src="js/test-api.js?v=20260922"></script>
